# Static checks for every push and pull request. Nothing is built or pushed.

name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and generated files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: emulators.json and generated files
        run: scripts/render.sh --check

      - name: docker-compose.yml
        run: docker compose -f docker-compose.yml config --quiet

      - name: Publish matrix
        run: .github/scripts/matrix.sh example/android-emulator-farm "$GITHUB_SHA" all | jq -e '.include | length > 0'

      - name: shellcheck
        run: shellcheck docker/*.sh scripts/*.sh .github/scripts/*.sh

      - name: hadolint
        run: docker run --rm -i -v "$PWD/.hadolint.yaml:/.config/hadolint.yaml:ro" hadolint/hadolint < docker/Dockerfile

      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -color
