# Builds, smoke-tests, and publishes linux/amd64 emulator images to Docker Hub.
#
# Repository: <DOCKERHUB_USERNAME>/<repository in emulators.json>
#
# emulators.json decides which APIs exist and which one is :latest.
# .github/scripts/matrix.sh turns it into the build matrix and tag list.
#
# Flow: plan -> sdk (shared layer, pushed once) -> one job per API
#       (build, boot on KVM, check adb, push) -> Docker Hub description.
# An image that fails its smoke test is never pushed.
#
# Settings (from a checkout of this repo):
#   gh variable set DOCKERHUB_USERNAME --body "your-dockerhub-username"
#   gh secret set DOCKERHUB_TOKEN < token-file
#
# The token needs Read, Write, Delete scope (Delete is only needed to edit the
# Docker Hub description). A DOCKERHUB_USERNAME secret is accepted when the
# variable is unset.

name: Publish images

on:
  workflow_dispatch:
    inputs:
      apis:
        description: 'APIs to publish: "all", or numbers such as "34 35 36"'
        required: true
        default: all
        type: string
      smoke_test:
        description: Boot each image and check adb before pushing
        required: false
        default: true
        type: boolean
  push:
    branches:
      - main
    paths:
      - docker/**
      - emulators.json
      - .github/scripts/**
      - .github/workflows/publish.yml

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.plan.outputs.image }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Docker Hub settings
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo "::error::Set DOCKERHUB_USERNAME (gh variable set)."; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo "::error::Set DOCKERHUB_TOKEN (gh secret set)."; exit 1; }

      - name: Plan the matrix
        id: plan
        env:
          APIS: ${{ inputs.apis || 'all' }}
        run: |
          image="${DOCKERHUB_USERNAME}/$(jq -r .repository emulators.json)"
          matrix="$(.github/scripts/matrix.sh "$image" "$GITHUB_SHA" "$APIS")"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          {
            echo "### Publishing to \`${image}\`"
            echo
            jq -r '.include[] | "- API \(.api) (Android \(.android), \(.system_image))"' <<<"$matrix"
          } >> "$GITHUB_STEP_SUMMARY"

  sdk:
    name: SDK layer
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE: ${{ needs.plan.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push the SDK layer
        uses: docker/build-push-action@v7
        with:
          context: ./docker
          target: sdk
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          cache-from: type=gha,scope=sdk
          cache-to: type=gha,scope=sdk,mode=max
          tags: |
            ${{ env.IMAGE }}:sdk
            ${{ env.IMAGE }}:sdk-${{ github.sha }}

  emulator:
    name: API ${{ matrix.api }}
    needs: [plan, sdk]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      IMAGE: ${{ needs.plan.outputs.image }}
      API: ${{ matrix.api }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/share/swift \
            /usr/local/.ghcup \
            /opt/hostedtoolcache
          sudo apt-get clean
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build API ${{ matrix.api }}
        uses: docker/build-push-action@v7
        with:
          context: ./docker
          target: emulator
          load: true
          push: false
          platforms: linux/amd64
          provenance: false
          sbom: false
          build-contexts: |
            sdk=docker-image://${{ env.IMAGE }}:sdk-${{ github.sha }}
          build-args: |
            API=${{ matrix.api }}
            SYSTEM_IMAGE=${{ matrix.system_image }}
            REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=android-${{ matrix.android }}
          tags: ${{ matrix.tags }}

      - name: Smoke test
        if: ${{ github.event_name == 'push' || inputs.smoke_test }}
        run: .github/scripts/smoke-test.sh "${IMAGE}:api${API}" "$API" 900

      - name: Push tags
        env:
          TAGS: ${{ matrix.tags }}
        run: |
          while read -r tag; do
            docker push "$tag"
          done <<<"$TAGS"

      - name: Write summary
        env:
          TAGS: ${{ matrix.tags }}
          ANDROID: ${{ matrix.android }}
          SYSTEM_IMAGE: ${{ matrix.system_image }}
        run: |
          {
            echo "### API ${API} (Android ${ANDROID}, ${SYSTEM_IMAGE})"
            echo
            sed 's/.*/- `&`/' <<<"$TAGS"
          } >> "$GITHUB_STEP_SUMMARY"

  description:
    name: Docker Hub description
    needs: [sdk, emulator]
    if: ${{ !cancelled() && needs.sdk.result == 'success' }}
    uses: ./.github/workflows/dockerhub-description.yml
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
