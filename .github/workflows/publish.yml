# Builds, optionally smoke-tests, and publishes linux/amd64 emulator images to Docker Hub.
#
# Repository: <namespace>/<repository> from emulators.json
#
# emulators.json decides which APIs exist and which one is :latest.
# .github/scripts/matrix.sh turns it into the build matrix and tag list.
#
# Flow: plan -> sdk (shared layer, pushed once) -> one job per API
#       (build and push) -> Docker Hub description.
#
# A push to main publishes only what it affects (.github/scripts/changed-apis.sh):
# every API when docker/ changes, otherwise the emulators.json entries that
# were added or changed. Workflow and script changes publish nothing; run the
# workflow by hand when they should.
#
# The smoke test is optional (manual runs only). When enabled, each image is
# booted on a KVM runner and checked over adb before it is pushed, and an
# image that fails is never pushed. It adds a few minutes per API.
#
# Settings (from a checkout of this repo):
#   gh variable set DOCKERHUB_USERNAME --body "your-dockerhub-username"
#   gh secret set DOCKERHUB_TOKEN < token-file
#
# The token needs Read, Write, Delete scope (Delete is only needed to edit the
# Docker Hub description). A DOCKERHUB_USERNAME secret is accepted when the
# variable is unset.

name: Publish images

on:
  workflow_dispatch:
    inputs:
      apis:
        description: 'APIs to publish: "all", or numbers such as "34 35 36"'
        required: true
        default: all
        type: string
      smoke_test:
        description: Boot each image on KVM and check adb before pushing (slower)
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - docker/**
      - emulators.json

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.plan.outputs.image }}
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check Docker Hub settings
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo "::error::Set DOCKERHUB_USERNAME (gh variable set)."; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo "::error::Set DOCKERHUB_TOKEN (gh secret set)."; exit 1; }

      - name: Plan the matrix
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          INPUT_APIS: ${{ inputs.apis }}
        run: |
          if [ "$EVENT" = push ]; then
            apis="$(.github/scripts/changed-apis.sh "$BEFORE")"
          else
            apis="${INPUT_APIS:-all}"
          fi
          image="$(jq -r '"\(.namespace)/\(.repository)"' emulators.json)"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          if [ -z "$apis" ]; then
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo "### Nothing to publish: no image is affected by this push." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          matrix="$(.github/scripts/matrix.sh "$image" "$GITHUB_SHA" "$apis")"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "count=$(jq '.include | length' <<<"$matrix")" >> "$GITHUB_OUTPUT"
          {
            echo "### Publishing to \`${image}\`"
            echo
            jq -r '.include[] | "- API \(.api) (Android \(.android), \(.system_image))"' <<<"$matrix"
          } >> "$GITHUB_STEP_SUMMARY"

  sdk:
    name: SDK layer
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE: ${{ needs.plan.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push the SDK layer
        uses: docker/build-push-action@v7
        with:
          context: ./docker
          target: sdk
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          cache-from: type=gha,scope=sdk
          cache-to: type=gha,scope=sdk,mode=max
          tags: |
            ${{ env.IMAGE }}:sdk
            ${{ env.IMAGE }}:sdk-${{ github.sha }}

  emulator:
    name: API ${{ matrix.api }}
    needs: [plan, sdk]
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      IMAGE: ${{ needs.plan.outputs.image }}
      API: ${{ matrix.api }}
      SMOKE_TEST: ${{ inputs.smoke_test && 'true' || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/share/swift \
            /usr/local/.ghcup \
            /opt/hostedtoolcache
          sudo apt-get clean
          df -h /

      - name: Enable KVM
        if: env.SMOKE_TEST == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build API ${{ matrix.api }}
        uses: docker/build-push-action@v7
        with:
          context: ./docker
          target: emulator
          # With the smoke test, load locally and push after it passes.
          load: ${{ env.SMOKE_TEST == 'true' }}
          push: ${{ env.SMOKE_TEST != 'true' }}
          platforms: linux/amd64
          provenance: false
          sbom: false
          build-contexts: |
            sdk=docker-image://${{ env.IMAGE }}:sdk-${{ github.sha }}
          build-args: |
            API=${{ matrix.api }}
            SYSTEM_IMAGE=${{ matrix.system_image }}
            REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=android-${{ matrix.android }}
          tags: ${{ matrix.tags }}

      - name: Smoke test
        if: env.SMOKE_TEST == 'true'
        run: .github/scripts/smoke-test.sh "${IMAGE}:api${API}" "$API" 900

      - name: Push tested tags
        if: env.SMOKE_TEST == 'true'
        env:
          TAGS: ${{ matrix.tags }}
        run: |
          while read -r tag; do
            docker push "$tag"
          done <<<"$TAGS"

      - name: Write summary
        env:
          TAGS: ${{ matrix.tags }}
          ANDROID: ${{ matrix.android }}
          SYSTEM_IMAGE: ${{ matrix.system_image }}
        run: |
          {
            echo "### API ${API} (Android ${ANDROID}, ${SYSTEM_IMAGE})"
            echo
            if [ "$SMOKE_TEST" = true ]; then echo "Smoke test passed."; else echo "Smoke test skipped."; fi
            echo
            while read -r tag; do
              echo "- \`${tag}\`"
            done <<<"$TAGS"
          } >> "$GITHUB_STEP_SUMMARY"

  description:
    name: Docker Hub description
    needs: [sdk, emulator]
    if: ${{ !cancelled() && needs.sdk.result == 'success' }}
    uses: ./.github/workflows/dockerhub-description.yml
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
